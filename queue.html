<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Slate Stack</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #faf8f4;
    color: #2b2a28;
    margin: 0;
    padding: 40px 24px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #6b6660; margin: 0 0 20px; font-size: 0.9rem; }
  button {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  .settings-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: #fff;
    border: 1px solid #e8e3da;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 0.82rem;
  }
  .settings-bar label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #6b6660;
  }
  .settings-bar select {
    font-family: inherit;
    font-size: 0.82rem;
    border: 1px solid #e8e3da;
    border-radius: 6px;
    padding: 4px 6px;
    background: #fff;
    color: #2b2a28;
  }
  #readNextBtn {
    background: #2d6a4f;
    color: #fff;
    font-size: 1rem;
    padding: 14px 20px;
    width: 100%;
    margin-bottom: 28px;
    border-radius: 8px;
  }
  #readNextBtn:disabled { background: #c9c4b8; cursor: default; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border: 1px solid #e8e3da;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .meta { min-width: 0; }
  .title {
    font-weight: 600;
    font-size: 0.92rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 380px;
  }
  .url {
    font-size: 0.78rem;
    color: #6b6660;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 380px;
  }
  .time {
    font-size: 0.72rem;
    color: #a39d8f;
    margin-top: 2px;
  }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .small { background: #eee9df; color: #2b2a28; }
  .small.danger { background: #f7e3df; color: #8a3b2e; }
  #emptyState { color: #6b6660; text-align: center; padding: 48px 0; display: none; }
  #countNote { font-size: 0.78rem; color: #a39d8f; margin: 0 0 14px; }
  .coffee-link {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 0.82rem;
    color: #2d6a4f;
    text-decoration: none;
  }
  .coffee-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Slate Stack</h1>
    <p class="sub">Tabs you sent here, kept in order. Nothing synced anywhere — this list lives only in this browser.</p>

    <a class="coffee-link" href="https://ko-fi.com/ruyzambrano" target="_blank" rel="noopener">☕ Find this useful? Buy me a coffee</a>

    <div class="settings-bar">
      <label>Sort:
        <select id="sortOrder">
          <option value="oldest">Oldest first</option>
          <option value="newest">Newest first</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="removeOnOpen">
        Remove from list when opened
      </label>
    </div>

    <p id="countNote"></p>

    <button id="readNextBtn">Read next</button>

    <div id="queueList"></div>
    <div id="emptyState">Nothing saved yet. Add tabs from the Slate Stack popup, right-click menu, or keyboard shortcut.</div>
  </div>
  <script type="module" src="queue.js"></script>
</body>
</html>
